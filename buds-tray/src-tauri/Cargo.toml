[workspace]

[package]
name = "buds-tray"
version = "0.2.0"
description = "OpenBuds - desktop controller for OnePlus Buds"
authors = ["vaisx05"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buds_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
buds-core = { path = "../../buds-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# This is its own Cargo workspace (separate from the root buds-core/buds-cli
# one), so the patch has to be repeated here - see ../../CLAUDE.md and
# ../../vendor/btleplug for why buds-core needs this fork.
[patch.crates-io]
btleplug = { path = "../../vendor/btleplug" }
